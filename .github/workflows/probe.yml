name: Probe

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    steps:
      - name: Sleep delay
        run: sleep ${{ vars.PROBE_SLEEP || 0 }}
      - name: Probe check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          HAS_PROBE_GREEN: ${{ contains(github.event.pull_request.labels.*.name, 'probe-green') }}
        run: |
          echo "Event: ${EVENT_NAME}"
          echo "Action: ${EVENT_ACTION}"
          echo "Labels: ${LABELS_JSON}"
          if [ "${HAS_PROBE_GREEN}" != "true" ]; then
            echo "probe-green missing. Check failed."
            exit 1
          fi
          echo "probe-green present. Check passed."
          exit 0
